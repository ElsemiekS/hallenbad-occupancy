name: Generate Occupancy Predictions

on:
  # Triggered externally at 05:00 Zürich time by cron-job.org via workflow_dispatch.
  # GitHub's built-in schedule is unreliable — cron-job.org fires on time.
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # darts install + training can take ~10 min cold

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements_predict.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements_predict.txt

      - name: Run prediction job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/predict.py
