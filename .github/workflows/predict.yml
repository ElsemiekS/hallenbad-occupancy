name: Generate Occupancy Predictions

on:
  # Run once per day at 05:00 Zürich time (04:00 UTC in winter / 03:00 in summer).
  # This is before the pool opens, so the forecast is ready when visitors check.
  schedule:
    - cron: "0 4 * * *"
  # Allow triggering manually from the Actions tab while the model is being tuned.
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # darts install + training can take ~10 min cold

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements_predict.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements_predict.txt

      - name: Run prediction job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/predict.py
