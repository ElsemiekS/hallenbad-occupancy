name: Scrape Hallenbad Occupancy

on:
  # Triggered externally every 5 minutes by cron-job.org via workflow_dispatch.
  # The built-in schedule was removed because GitHub's cron is unreliable at
  # short intervals — cron-job.org provides a more consistent external trigger.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      # Chrome and chromedriver are pre-installed on ubuntu-latest
      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py
